<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood Preloader</title>
<style>
  :root{ --red:#c1121f; --red-dark:#8d0b16; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#2b2b2b}
  body.is-loading{overflow:hidden}

  /* ================= PRELOADER ================= */
  #preloader{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#fff;overflow:hidden;--r:0px}
  #preloader.opening{
    -webkit-mask-image:radial-gradient(circle at 50% 100%, rgba(0,0,0,0) var(--r), #000 calc(var(--r) + 2px));
            mask-image:radial-gradient(circle at 50% 100%, rgba(0,0,0,0) var(--r), #000 calc(var(--r) + 2px));
  }
  #preloader.gone{display:none}

  .cam{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;transform-origin:50% 100%;will-change:transform}

  /* the drip is drawn as one live SVG shape (origin = centre of the top edge) */
  .blood{position:absolute;left:50%;top:0;z-index:2;overflow:visible;pointer-events:none}

  /* puddle */
  .puddle{
    position:absolute;left:50%;bottom:-1px;width:0;height:1.6vh;min-height:8px;transform:translateX(-50%);
    background:linear-gradient(#d3202e,#a30f1b);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    transition:width 1.1s cubic-bezier(.25,.8,.25,1), height 1.1s cubic-bezier(.25,.8,.25,1);
  }
  .particle{position:absolute;left:50%;bottom:0;border-radius:50%;background:var(--red);opacity:0;pointer-events:none}
  .ring{
    position:absolute;left:50%;bottom:-3px;width:24px;height:7px;margin-left:-12px;border-radius:50%;
    border:2px solid var(--red);opacity:0;pointer-events:none;
  }

  /* rising blood pool with live waves */
  .pool{
    position:absolute;left:0;right:0;top:100%;height:calc(100% + 200px);z-index:3;overflow:hidden;
    display:flex;flex-direction:column;will-change:transform;
  }
  .wave{flex:none;display:block;width:200%;height:120px;margin-bottom:-1px;animation:waveMove 4s linear infinite}
  .wave.w2{position:absolute;top:-10px;left:0;opacity:.45;animation-duration:6s;animation-direction:reverse}
  @keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .pbody{flex:1;background:linear-gradient(#c1121f 0,#a50f1c 35%,#7d0a14 100%)}

  /* tagline on the red screen */
  .tag{
    position:absolute;left:0;right:0;top:50%;z-index:4;text-align:center;color:#fff;
    font-size:clamp(12px,2.4vw,16px);letter-spacing:.7em;text-transform:uppercase;opacity:0;transform:translateY(-50%);
    transition:opacity 1s ease, letter-spacing 1.6s cubic-bezier(.2,.7,.2,1);
  }
  .tag.show{opacity:1;letter-spacing:.38em}
  .tag.out{opacity:0;transition:opacity .5s ease}

  /* small hint, only if the browser is still blocking sound */
  .hint{
    position:absolute;left:0;right:0;bottom:7vh;z-index:5;text-align:center;color:#9a9a9a;
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .6s ease;
  }
  .hint.show{opacity:1}

  /* ================= DEMO SITE (replace with your website) ================= */
  #site{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    opacity:0;transform:scale(1.12);filter:blur(8px);
    transition:opacity 1.5s ease, transform 2s cubic-bezier(.2,.7,.2,1), filter 1.5s ease;
  }
  #site.ready{opacity:1;transform:none;filter:none}
  #site h1{font-size:clamp(28px,5vw,48px);color:var(--red)}
  #site p{color:#777}
</style>
</head>
<body class="is-loading">

<!-- ============ PRELOADER START (copy from here) ============ -->
<div id="preloader" aria-label="Loading" role="status">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="bloodGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e63946"/>
        <stop offset=".55" stop-color="#c1121f"/>
        <stop offset="1" stop-color="#8d0b16"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="cam" id="cam">
    <svg class="blood" width="1" height="1" aria-hidden="true">
      <path id="remnant" fill="#e63946"/>
      <path id="body" fill="url(#bloodGrad)"/>
      <path id="gloss" fill="none" stroke="#fff" stroke-linecap="round" opacity=".55"/>
    </svg>
    <div class="puddle" id="puddle"></div>
  </div>

  <div class="pool" id="pool">
    <svg class="wave w2" viewBox="0 0 2880 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60Q180 0 360 60T720 60T1080 60T1440 60T1800 60T2160 60T2520 60T2880 60V120H0Z" fill="#ff4d5e"/></svg>
    <svg class="wave" viewBox="0 0 2880 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70Q180 10 360 70T720 70T1080 70T1440 70T1800 70T2160 70T2520 70T2880 70V120H0Z" fill="#c1121f"/></svg>
    <div class="pbody"></div>
  </div>

  <div class="tag" id="tag">Every drop saves a life</div>
  <div class="hint" id="hint">Tap anywhere for sound</div>
</div>
<!-- ============ PRELOADER END (copy to here) ============ -->

<!-- Your website goes here -->
<main id="site">
  <h1>Your website opens here</h1>
  <p>Replace this block with your real website content.</p>
</main>

<script>
(function () {
  var pre    = document.getElementById('preloader');
  var site   = document.getElementById('site');
  var cam    = document.getElementById('cam');
  var pool   = document.getElementById('pool');
  var puddle = document.getElementById('puddle');
  var tag    = document.getElementById('tag');
  var hint   = document.getElementById('hint');
  var bodyP  = document.getElementById('body');
  var glossP = document.getElementById('gloss');
  var remP   = document.getElementById('remnant');
  var gentle = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= loading state ================= */
  var loaded = false, loadWaiters = [];
  function markLoaded() { loaded = true; loadWaiters.splice(0).forEach(function (f) { f(); }); }
  if (document.readyState === 'complete') markLoaded(); else window.addEventListener('load', markLoaded);
  setTimeout(markLoaded, 8000);                          // safety net for very slow networks
  function whenLoaded() { return new Promise(function (res) { loaded ? res() : loadWaiters.push(res); }); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function finishNow() {
    document.body.classList.remove('is-loading');
    site.classList.add('ready');
    pre.classList.add('gone');
  }
  if (!Element.prototype.animate) { finishNow(); return; }

  /* ================= SOUND: blood-drop "plip" + heartbeat (synthesised, no files) ================= */
  var Sfx = (function () {
    var ctx, master, noiseBuf, rand = Math.random, runCb = null;

    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = .95;
        var comp = ctx.createDynamicsCompressor();
        master.connect(comp); comp.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = rand() * 2 - 1;
        ctx.onstatechange = function () { if (running() && runCb) runCb(); };
      }
    } catch (e) { ctx = null; }

    function running() { return !!ctx && ctx.state === 'running'; }
    function resume() {
      if (!ctx || ctx.state === 'running') return;
      try {
        ctx.resume();
        var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();   // silent blip (unlocks iOS / Safari)
        s.buffer = b; s.connect(ctx.destination); s.start(0);
      } catch (e) {}
    }
    ['pointerdown', 'mousedown', 'touchstart', 'touchend', 'keydown', 'click'].forEach(function (ev) {
      window.addEventListener(ev, resume, { passive: true, capture: true });
    });
    resume();

    function env(t, attack, peak, dur) {
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(master);
      return g;
    }
    function tone(f0, f1, dur, vol, delay, glide) {
      var t = ctx.currentTime + (delay || 0);
      var o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + (glide || dur));
      o.connect(env(t, .005, vol, dur));
      o.start(t); o.stop(t + dur + .05);
    }
    function noiseBurst(type, f0, f1, dur, vol, delay, q) {
      var t = ctx.currentTime + (delay || 0);
      var s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      var f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q || .8;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      s.connect(f); f.connect(env(t, .003, vol, dur));
      s.start(t, rand() * .5); s.stop(t + dur + .05);
    }

    /* blood drop touching the window: contact tick -> quick rising "plip" -> soft low body.
       `delay` (seconds) lands it exactly on the frame the drop touches. */
    function drop(delay) {
      if (!running()) return false;
      var lat = (ctx.outputLatency || ctx.baseLatency || 0);
      delay = Math.max(0, (delay || 0) - lat);
      noiseBurst('bandpass', 3000, 3000, .035, .16, delay, .9);
      tone(430, 1050, .28, .6, delay, .06);
      tone(900, 2100, .14, .11, delay, .06);
      tone(165, 90, .24, .26, delay, .18);
      return true;
    }

    /* one heartbeat: lub-dub */
    function beat() {
      if (!running()) return;
      tone(78, 42, .2, .75, 0);
      noiseBurst('lowpass', 260, 90, .16, .25, 0);
      tone(66, 36, .22, .55, .22);
    }

    return { running: running, drop: drop, beat: beat, onrun: function (fn) { runCb = fn; } };
  })();

  /* ================= helpers ================= */
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeIn(t) { return t * t * t; }
  function easeInOut(t) { return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
  function f(n) { return n.toFixed(2); }

  /* ================= drip geometry (all in px; x = 0 is the centre, y = 0 is the top edge) ================= */
  // drop still joined to the top edge: smooth meniscus -> neck -> round bulb
  function pendantPath(L, nw, fw, rx, ry) {
    var fl = Math.min(L, .7 * rx + 1), cy = L + ry, tp = L;
    return 'M' + f(-fw) + ' 0 Q' + f(-nw) + ' 0 ' + f(-nw) + ' ' + f(fl) +
      ' L' + f(-nw) + ' ' + f(tp) +
      ' C' + f(-nw) + ' ' + f(tp + ry * .25) + ' ' + f(-rx) + ' ' + f(cy - ry * .55) + ' ' + f(-rx) + ' ' + f(cy) +
      ' C' + f(-rx) + ' ' + f(cy + ry * .56) + ' ' + f(-rx * .56) + ' ' + f(cy + ry) + ' 0 ' + f(cy + ry) +
      ' C' + f(rx * .56) + ' ' + f(cy + ry) + ' ' + f(rx) + ' ' + f(cy + ry * .56) + ' ' + f(rx) + ' ' + f(cy) +
      ' C' + f(rx) + ' ' + f(cy - ry * .55) + ' ' + f(nw) + ' ' + f(tp + ry * .25) + ' ' + f(nw) + ' ' + f(tp) +
      ' L' + f(nw) + ' ' + f(fl) + ' Q' + f(nw) + ' 0 ' + f(fw) + ' 0Z';
  }
  // free-falling drop: classic teardrop with a pointed tip
  function freePath(rx, ry, cy, tail) {
    var tip = cy - ry - tail;
    return 'M0 ' + f(tip) +
      ' C0 ' + f(tip) + ' ' + f(-rx) + ' ' + f(cy - ry * .8) + ' ' + f(-rx) + ' ' + f(cy) +
      ' C' + f(-rx) + ' ' + f(cy + ry * .56) + ' ' + f(-rx * .56) + ' ' + f(cy + ry) + ' 0 ' + f(cy + ry) +
      ' C' + f(rx * .56) + ' ' + f(cy + ry) + ' ' + f(rx) + ' ' + f(cy + ry * .56) + ' ' + f(rx) + ' ' + f(cy) +
      ' C' + f(rx) + ' ' + f(cy - ry * .8) + ' 0 ' + f(tip) + ' 0 ' + f(tip) + 'Z';
  }
  // what is left of the neck on the top edge after the drop breaks away
  function remnantPath(L2, nw, fw) {
    if (L2 < .6) return '';
    var fl = Math.min(L2 * .5, 6);
    return 'M' + f(-fw) + ' 0 Q' + f(-nw) + ' 0 ' + f(-nw) + ' ' + f(fl) +
      ' Q' + f(-nw) + ' ' + f(L2) + ' 0 ' + f(L2) +
      ' Q' + f(nw) + ' ' + f(L2) + ' ' + f(nw) + ' ' + f(fl) + ' Q' + f(nw) + ' 0 ' + f(fw) + ' 0Z';
  }
  function glossPath(cy, rx, ry) {
    return 'M' + f(-rx * .5) + ' ' + f(cy + ry * .2) + ' Q' + f(-rx * .62) + ' ' + f(cy - ry * .28) + ' ' + f(-rx * .3) + ' ' + f(cy - ry * .6);
  }

  var GROW = 1400, PINCH = 240, MAXHOLD = 3000;
  var C = { k: .6, parts: 22, power: .22, puddle: '26vw', shake: .02 };

  /* ================= ONE small drop: swells on the top edge -> thin neck -> breaks off -> falls -> touches the window ================= */
  function runDrop() {
    return new Promise(function (resolve) {
      var H = window.innerHeight, W = window.innerWidth;
      var R = Math.max(16, Math.min(26, W * .026));          // final radius of the drop
      var L1 = 1.5 * R, L2 = L1 + .45 * R, RY2 = 1.3;         // neck length at end of swelling / at break-off
      var cyD = L2 + RY2 * R;                                  // centre of the drop at the moment it breaks away
      glossP.setAttribute('stroke-width', Math.max(1.4, R * .17).toFixed(2));

      // physics of the fall (the exact touch time is known in advance, so the sound can be scheduled to it)
      var Tf = clamp01((1150 * Math.sqrt(H / 700) - 800) / 800) * 800 + 800;
      var g = 2 * (H - cyD - R * 1.1) / (Tf * Tf);
      function ryF(tf) { return R * (1.1 + .2 * Math.exp(-tf / 130) + .12 * (tf / Tf)); }
      function cyF(tf) { return cyD + .5 * g * tf * tf; }
      var tc = 0;
      while (tc < 6000 && cyF(tc) + ryF(tc) < H) tc += 2;

      var stage = 'grow', tGrow = performance.now(), tHold = 0, tPinch = 0, tFall = 0, tTouch = 0;
      var touchAt = 0, scheduled = false, sxc = 1, syc = 1, cyc = 0, tailc = 0, hinted = false;

      function scheduleSound() {
        if (scheduled || !touchAt) return;
        var until = touchAt - performance.now();
        if (until > 30 && Sfx.drop(until / 1000)) scheduled = true;
      }
      Sfx.onrun(function () { scheduleSound(); });

      function setShape(body, gl, rem, op) {
        bodyP.setAttribute('d', body); glossP.setAttribute('d', gl); remP.setAttribute('d', rem);
        bodyP.setAttribute('opacity', op);
      }

      function frame(now) {
        if (stage === 'grow' || stage === 'hold') {
          var p, trem = 0;
          if (stage === 'grow') {
            p = clamp01((now - tGrow) / GROW);
            if (p >= 1) {
              if (Sfx.running()) { stage = 'pinch'; tPinch = now; touchAt = now + PINCH + tc; scheduleSound(); }
              else { stage = 'hold'; tHold = now; hint.classList.add('show'); hinted = true; }
            }
          }
          if (stage === 'hold') {                          // sound still blocked: wait a moment for a tap (never forced)
            p = 1; trem = 1;
            if (Sfx.running() || now - tHold > MAXHOLD) {
              hint.classList.remove('show');
              stage = 'pinch'; tPinch = now; touchAt = now + PINCH + tc; scheduleSound();
            }
          }
          if (stage === 'grow' || stage === 'hold') {
            var r  = R * lerp(.28, 1, easeOut(clamp01(p / .8)));
            var L  = L1 * easeInOut(p);
            var nw = r * lerp(.9, .3, easeIn(p));
            var fw = nw + R * lerp(.25, .6, p);
            var q  = 1 + .02 * Math.sin(now / 75) * p + trem * .035 * Math.sin(now / 38);
            var ry = r * (1 + .18 * easeIn(p)) * q, rx = r * (1 - .06 * easeIn(p)) / Math.sqrt(q);
            setShape(pendantPath(L, nw, fw, rx, ry), glossPath(L + ry, rx, ry), '', clamp01((now - tGrow) / 250));
            requestAnimationFrame(frame); return;
          }
        }

        if (stage === 'pinch') {                           // the neck stretches thin and snaps
          var qq = clamp01((now - tPinch) / PINCH);
          var nw2 = lerp(.3 * R, .06 * R, easeOut(qq));
          var L = lerp(L1, L2, easeIn(qq));
          var ry2 = R * lerp(1.18, RY2, qq), rx2 = R * lerp(.94, .9, qq);
          var fw2 = nw2 + R * .6 * (1 - .25 * qq);
          setShape(pendantPath(L, nw2, fw2, rx2, ry2), glossPath(L + ry2, rx2, ry2), '', 1);
          if (qq >= 1) { stage = 'fall'; tFall = now; }
          requestAnimationFrame(frame); return;
        }

        if (stage === 'fall') {
          var tf = now - tFall;
          var ry3 = ryF(tf), rx3 = R * (1 - (ry3 / R - 1) * .35), cy3 = cyF(tf);
          var tail = R * (.95 + .12 * Math.exp(-tf / 150) * Math.cos(tf / 45)) + R * .06 * (tf / Tf);
          // the leftover neck springs back up into the top edge
          var rl = clamp01(tf / 320), L2r = (L2 / 2) * (1 - easeOut(rl));
          var remD = remnantPath(L2r, .06 * R + (.3 * R) * (1 - rl) * .0, .06 * R + R * .6 * .75 * (1 - easeOut(rl)) + .0);
          setShape(freePath(rx3, ry3, cy3, tail), glossPath(cy3, rx3, ry3), remD, 1);
          if (cy3 + ry3 >= H) {                            // touches the window
            stage = 'squash'; tTouch = now; sxc = rx3; syc = ry3; cyc = cy3; tailc = tail;
            impact();
          }
          requestAnimationFrame(frame); return;
        }

        if (stage === 'squash') {                          // flatten into the window and melt away
          var ti = clamp01((now - tTouch) / 240);
          var ry4 = lerp(syc, .1 * R, easeOut(ti)), rx4 = lerp(sxc, 2.6 * R, easeOut(ti));
          var tail4 = tailc * (1 - easeOut(ti));
          var cy4 = H - ry4;
          setShape(freePath(rx4, ry4, cy4, tail4), '', '', 1 - easeIn(ti));
          if (ti >= 1) { setShape('', '', '', 0); resolve(); return; }
          requestAnimationFrame(frame);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function splash() {
    var m = Math.min(window.innerWidth, window.innerHeight);
    var parts = gentle ? Math.round(C.parts / 2) : C.parts;
    for (var i = 0; i < parts; i++) {
      var a = (Math.random() * 2 - 1) * 1.25;
      var sp = C.power * m * (.55 + Math.random() * .6);
      var dx = Math.sin(a) * sp * 1.15, up = Math.cos(a) * sp;
      var sz = 3 + Math.random() * 6;
      var p = document.createElement('div');
      p.className = 'particle';
      p.style.width = p.style.height = sz + 'px';
      p.style.marginLeft = (-sz / 2) + 'px';
      cam.appendChild(p);
      var an = p.animate([
        { transform: 'translate(0,0)', opacity: 1, easing: 'cubic-bezier(.2,.7,.4,1)' },
        { offset: .5, transform: 'translate(' + (dx * .75) + 'px,' + (-up) + 'px)', opacity: 1, easing: 'cubic-bezier(.5,0,.9,.5)' },
        { transform: 'translate(' + dx + 'px,' + sz + 'px) scale(.6)', opacity: 0 }
      ], { duration: 900 + Math.random() * 600, fill: 'forwards' });
      an.onfinish = (function (n) { return function () { n.remove(); }; })(p);
    }
    for (var r = 0; r < 2; r++) {
      var ring = document.createElement('div');
      ring.className = 'ring';
      cam.appendChild(ring);
      var ra = ring.animate([
        { transform: 'scale(.3)', opacity: .8 },
        { transform: 'scale(' + (10 + C.k * 14) + ',' + (3 + C.k * 2) + ')', opacity: 0 }
      ], { duration: 1400, delay: r * 200, easing: 'cubic-bezier(.2,.6,.3,1)', fill: 'forwards' });
      ra.onfinish = (function (n) { return function () { n.remove(); }; })(ring);
    }
  }

  function impact() {
    puddle.style.width = C.puddle;
    puddle.style.height = '3vh';
    splash();
    if (!gentle) cam.animate([                            // tiny camera "zoom in" thump
      { transform: 'scale(1)' },
      { transform: 'scale(' + (1 + C.shake) + ')', offset: .3 },
      { transform: 'scale(1)' }
    ], { duration: 800, easing: 'ease-in-out' });
  }

  function pulseTag() {
    tag.animate([
      { transform: 'translateY(-50%) scale(1)' },
      { transform: 'translateY(-50%) scale(1.08)', offset: .2 },
      { transform: 'translateY(-50%) scale(1)', offset: .42 },
      { transform: 'translateY(-50%) scale(1.045)', offset: .6 },
      { transform: 'translateY(-50%) scale(1)' }
    ], { duration: 700, easing: 'ease-out' });
  }

  function riseAndOpen() {
    var H = window.innerHeight, W = window.innerWidth, RISE = 2400;
    var rise = pool.animate([
      { transform: 'translateY(0)' },
      { transform: 'translateY(' + (-(H + 150)) + 'px)' }
    ], { duration: RISE, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'forwards' });

    return rise.finished.then(function () {
      tag.classList.add('show');
      var beating = true;                                  // heartbeat repeats the whole time the screen is red
      (function loop() {
        if (!beating) return;
        Sfx.beat(); pulseTag();
        setTimeout(loop, 1050);
      })();
      return wait(2700).then(function () { beating = false; });
    }).then(function () {
      tag.classList.add('out');
      site.classList.add('ready');                        // site zooms in underneath (silent)
      pre.classList.add('opening');
      var maxR = Math.hypot(W / 2, H) + 30, dur = 1900, t0 = performance.now();
      return new Promise(function (done) {
        (function step(now) {
          var t = Math.min((now - t0) / dur, 1);
          pre.style.setProperty('--r', (maxR * easeInOut(t)).toFixed(1) + 'px');
          t < 1 ? requestAnimationFrame(step) : done();
        })(t0);
      });
    }).then(function () {
      document.body.classList.remove('is-loading');
      pre.classList.add('gone');
    });
  }

  /* ================= run ================= */
  wait(200)
    .then(runDrop)
    .then(function () { return wait(600); })
    .then(whenLoaded)                                     // never open before the real page has loaded
    .then(riseAndOpen);
})();
</script>
