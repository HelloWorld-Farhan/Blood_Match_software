<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Blood Match — Emergency Transfusion Network</title>
    <script type="text/javascript">
      // Cloudflare & Static Host SPA Route Redirect
      var l = window.location;
      var path = l.pathname;
      var cleanPath = path.startsWith('/') ? path.substring(1) : path;
      var target = l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(cleanPath) + (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') + l.hash;
      l.replace(target);
    </script>
  </head>
  <body style="background:#F5F1EF;margin:0;padding:0;">
  </body>
</html>
